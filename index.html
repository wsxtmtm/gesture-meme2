<title>Gesture Meme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #141416;
    --border: #2a2a2e;
    --text: #e8e8ec;
    --text-dim: #78787e;
    --accent: #c4ff36;
    --meme-bg: #f2f0ed;
    --radius: 14px;
    font-family: 'Space Mono', monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f5f0;
      --surface: #eaeae5;
      --border: #d0d0cb;
      --text: #1a1a1e;
      --text-dim: #8a8a8e;
      --meme-bg: #ffffff;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f5f0;
    --surface: #eaeae5;
    --border: #d0d0cb;
    --text: #1a1a1e;
    --text-dim: #8a8a8e;
    --meme-bg: #ffffff;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    -webkit-user-select: none;
    user-select: none;
  }
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg); z-index: 200;
    gap: 16px;
  }
  #loading.hidden { display: none; }
  #loading h1 {
    font-size: 1.5rem; font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent);
  }
  .progress-track {
    width: 220px; height: 3px;
    background: var(--border); border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: var(--accent);
    transition: width 0.4s ease;
  }
  #load-status {
    font-size: 0.75rem; color: var(--text-dim);
    text-align: center;
  }
  #error {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg); z-index: 200;
    gap: 12px; padding: 24px;
    text-align: center;
  }
  #error h2 { font-size: 1.25rem; color: var(--accent); }
  #error p { font-size: 0.8rem; color: var(--text-dim); max-width: 360px; line-height: 1.5; }
  #app {
    display: none; flex-direction: column;
    height: 100%; min-height: 0;
  }
  #header {
    display: flex; align-items: center; justify-content: center;
    padding: 10px 0;
    gap: 10px;
    flex-shrink: 0;
  }
  #header h1 {
    font-size: 0.85rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim);
  }
  #gesture-badge {
    font-size: 0.7rem; font-weight: 700;
    padding: 3px 10px;
    background: var(--accent); color: #0a0a0b;
    border-radius: 20px;
    letter-spacing: 0.04em; text-transform: uppercase;
    transition: opacity 0.2s;
  }
  #gesture-hint {
    font-size: 0.7rem; color: var(--text-dim);
    text-align: center; padding: 0;
    min-height: 1.2em;
    transition: opacity 0.2s;
  }
  #debug-info {
    position: absolute; bottom: 8px; left: 8px;
    font-size: 0.55rem; font-weight: 700;
    padding: 3px 8px;
    background: rgba(0,0,0,0.6); color: var(--accent);
    border-radius: 6px;
    letter-spacing: 0.03em;
    backdrop-filter: blur(4px);
    z-index: 5; font-family: 'Space Mono', monospace;
  }
  #main {
    flex: 1; display: flex;
    gap: 2px; min-height: 0;
    border-radius: var(--radius);
    overflow: hidden;
  }
  #meme-panel {
    flex: 1; display: flex;
    align-items: center; justify-content: center;
    background: var(--meme-bg);
    position: relative; overflow: hidden;
    min-width: 0;
  }
  #meme-panel img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: opacity 0.25s ease;
  }
  #cam-panel {
    flex: 1; position: relative;
    background: #000; overflow: hidden;
    min-width: 0;
  }
  #webcam {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: block;
  }
  #draw-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #cam-label {
    position: absolute; top: 8px; left: 8px;
    font-size: 0.6rem; font-weight: 700;
    padding: 3px 8px;
    background: rgba(0,0,0,0.6); color: #fff;
    border-radius: 6px;
    letter-spacing: 0.05em; text-transform: uppercase;
    backdrop-filter: blur(4px);
    z-index: 5;
  }
  #thumbs {
    display: flex; gap: 8px;
    padding: 10px 0;
    overflow-x: auto;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #thumbs::-webkit-scrollbar { display: none; }
  .tb {
    flex: 0 0 auto;
    width: 56px; height: 56px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--meme-bg);
    cursor: pointer;
    padding: 3px;
    transition: border-color 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .tb:hover { border-color: var(--accent); }
  .tb.active {
    border-color: var(--accent);
    transform: scale(1.08);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .tb img {
    width: 100%; height: 100%;
    object-fit: contain; border-radius: 6px;
  }
  @media (max-width: 640px) {
    #main { flex-direction: column; }
    .tb { width: 48px; height: 48px; }
    #header h1 { font-size: 0.75rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>

<div id="loading">
  <h1>GESTURE MEME</h1>
  <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
  <div id="load-status">warming up...</div>
</div>

<div id="error">
  <h2>Camera Required</h2>
  <p id="err-msg">This app needs your webcam to detect hand gestures. Please allow camera access and reload.</p>
</div>

<div id="app">
  <div id="header">
    <h1>Gesture Meme</h1>
    <div id="gesture-badge">idle</div>
  </div>
  <div id="gesture-hint"></div>
  <div id="main">
    <div id="meme-panel">
      <img id="meme-img" alt="meme" />
    </div>
    <div id="cam-panel">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="draw-canvas"></canvas>
      <div id="cam-label">live</div>
      <div id="debug-info"></div>
    </div>
  </div>
  <div id="thumbs"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>

<script>
(async function(){
  'use strict';

  const MEMES = [
    { id:'bicep',    label:'Bicep 💪',     img:'images/bicep.jpg',   hint:'Покажи кулак' },
    { id:'thumbsup', label:'Thumbs Up 👍', img:'images/thumbsup.jpg', hint:'Большой палец вверх' },
    { id:'middle',   label:'Middle 🖕',    img:'images/middlefinger.jpg', hint:'Средний палец' },
    { id:'shocked',  label:'Shocked 😱',   img:'images/shocked.jpg', hint:'Две руки вверх, пальцы растопырь' },
    { id:'prayer',   label:'Prayer 🙏',    img:'images/prayer.jpg',  hint:'Сложи руки вместе' },
    { id:'tongue',   label:'Tongue 😛',    img:'images/tongue.jpg',  hint:'Приоткрой рот немного' },
    { id:'scream',   label:'Scream 😲',    img:'images/scream.jpg',  hint:'Широко открой рот' },
    { id:'shh',      label:'Shh 🤫',       img:'images/shh.jpg',     hint:'Указательный палец ко рту' },
    { id:'peace',    label:'Peace ✌️',     img:'images/peace.jpg',   hint:'Пис двумя руками' },
    { id:'idle',     label:'Idle',          img:'images/idle.jpg',    hint:'' },
  ];

  const HOLD_MS = 250;
  const FACE_EVERY = 4;

  const $loading  = document.getElementById('loading');
  const $prog     = document.getElementById('prog');
  const $status   = document.getElementById('load-status');
  const $error    = document.getElementById('error');
  const $errMsg   = document.getElementById('err-msg');
  const $app      = document.getElementById('app');
  const $memeImg  = document.getElementById('meme-img');
  const $badge    = document.getElementById('gesture-badge');
  const $thumbs   = document.getElementById('thumbs');
  const $hint     = document.getElementById('gesture-hint');
  const $debug    = document.getElementById('debug-info');
  const $video    = document.getElementById('webcam');
  const $canvas   = document.getElementById('draw-canvas');
  const ctx       = $canvas.getContext('2d');

  const imgCache = {};
  await Promise.all(MEMES.map(m => new Promise(res => {
    const img = new Image();
    img.onload = img.onerror = res;
    img.src = m.img;
    imgCache[m.id] = img;
  })));

  MEMES.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'tb';
    btn.dataset.id = m.id;
    btn.innerHTML = '<img src="'+m.img+'" alt="'+m.label+'">';
    btn.addEventListener('click', () => {
      manualOverride = m.id;
      showMeme(m.id);
      setTimeout(() => { manualOverride = null; }, 2000);
    });
    $thumbs.appendChild(btn);
  });

  let currentMeme = 'idle';
  let pendingGesture = 'idle';
  let pendingStart = 0;
  let manualOverride = null;
  let frameCount = 0;
  let latestHands = null;
  let latestFace = null;

  function showMeme(id) {
    if (currentMeme === id) return;
    currentMeme = id;
    const m = MEMES.find(x => x.id === id) || MEMES[9];
    $memeImg.style.opacity = '0';
    setTimeout(() => {
      $memeImg.src = m.img;
      $memeImg.style.opacity = '1';
    }, 120);
    $badge.textContent = m.label;
    $hint.textContent = m.hint || '';
    document.querySelectorAll('.tb').forEach(b => {
      b.classList.toggle('active', b.dataset.id === id);
    });
  }

  function dist(a, b) {
    return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
  }

  function isExtended(lm, tip, pip, mcp) {
    const tipDist = dist(lm[tip], lm[mcp]);
    const pipDist = dist(lm[pip], lm[mcp]);
    return tipDist > pipDist * 1.05;
  }

  function isClosed(lm, tip, pip, mcp) {
    const tipDist = dist(lm[tip], lm[mcp]);
    const pipDist = dist(lm[pip], lm[mcp]);
    return tipDist < pipDist * 1.1;
  }

  function isThumbOut(lm) {
    const tipD = dist(lm[4], lm[0]);
    const ipD  = dist(lm[3], lm[0]);
    const tipD2 = dist(lm[4], lm[5]);
    const ipD2  = dist(lm[3], lm[5]);
    return (tipD > ipD * 1.05) || (tipD2 > ipD2 * 1.05);
  }

  function isThumbClosed(lm) {
    const tipD = dist(lm[4], lm[0]);
    const ipD  = dist(lm[3], lm[0]);
    return tipD < ipD * 1.15;
  }

  function fingers(lm) {
    return {
      thumb:  isThumbOut(lm),
      index:  isExtended(lm, 8, 6, 5),
      middle: isExtended(lm, 12, 10, 9),
      ring:   isExtended(lm, 16, 14, 13),
      pinky:  isExtended(lm, 20, 18, 17),
    };
  }

  function handCenter(lm) {
    const pts = [lm[0], lm[5], lm[9], lm[13], lm[17]];
    return {
      x: pts.reduce((s,p) => s+p.x, 0) / 5,
      y: pts.reduce((s,p) => s+p.y, 0) / 5,
    };
  }

  function mouthOpenRatio(fl) {
    if (!fl || !fl.length) return 0;
    const lm = fl[0];
    const mouthH = Math.abs(lm[14].y - lm[13].y);
    const faceH  = Math.abs(lm[152].y - lm[10].y);
    return faceH > 0.001 ? mouthH / faceH : 0;
  }

  function classify() {
    const hands = latestHands;
    const face  = latestFace;

    const hs = [];
    if (hands && hands.multiHandLandmarks) {
      for (let i = 0; i < hands.multiHandLandmarks.length; i++) {
        const lm = hands.multiHandLandmarks[i];
        const f = fingers(lm);
        const c = handCenter(lm);
        const closedCount = [8,12,16,20].filter((tip,j) => isClosed(lm, tip, [6,10,14,18][j])).length;
        hs.push({ lm, f, c, closedCount });
      }
    }

    const mouth = mouthOpenRatio(face ? face.multiFaceLandmarks : null);

    if (hs.length >= 2) {
      const [a, b] = hs;
      const cd = dist(a.c, b.c);

      if (cd < 0.30) {
        return 'prayer';
      }

      if (!a.f.index && a.f.middle && !a.f.ring &&
          !b.f.index && b.f.middle && !b.f.ring) {
        return 'middle';
      }

      if (a.f.index && a.f.middle && b.f.index && b.f.middle) {
        if (a.c.y < 0.55 && b.c.y < 0.55 && cd > 0.35) {
          return 'shocked';
        }
        return 'peace';
      }

      if (cd > 0.3 && a.c.y < 0.55 && b.c.y < 0.55) {
        return 'shocked';
      }
    }

    if (hs.length >= 1) {
      for (const h of hs) {
        const f = h.f;
        if (!f.index && f.middle && !f.ring && !f.pinky) {
          return 'middle';
        }
      }

      for (const h of hs) {
        const f = h.f;
        if (f.thumb && !f.index && !f.middle && !f.ring && !f.pinky) {
          if (h.lm[4].y < h.lm[3].y) {
            return 'thumbsup';
          }
        }
      }

      for (const h of hs) {
        const f = h.f;
        if (f.index && f.middle && !f.ring && !f.pinky) {
          return 'peace';
        }
      }

      for (const h of hs) {
        const f = h.f;
        if (f.index && !f.middle && !f.ring && !f.pinky) {
          if (h.c.x > 0.2 && h.c.x < 0.8 && h.c.y > 0.2 && h.c.y < 0.75) {
            return 'shh';
          }
        }
      }

      for (const h of hs) {
        const f = h.f;
        if (f.index && f.middle && f.ring && f.pinky) {
          if (h.c.y < 0.55) return 'shocked';
        }
        if (!f.index && !f.middle && !f.ring && !f.pinky && !f.thumb) {
          return 'bicep';
        }
      }
    }

    if (mouth > 0.25) return 'scream';
    if (mouth > 0.12) return 'tongue';

    return 'idle';
  }

  function drawHands() {
    $canvas.width = $video.videoWidth || 640;
    $canvas.height = $video.videoHeight || 480;
    ctx.clearRect(0, 0, $canvas.width, $canvas.height);

    if (!latestHands || !latestHands.multiHandLandmarks) return;

    ctx.save();
    ctx.translate($canvas.width, 0);
    ctx.scale(-1, 1);

    for (const lm of latestHands.multiHandLandmarks) {
      window.drawConnectors(ctx, lm, window.HAND_CONNECTIONS, {
        color: 'rgba(196, 255, 54, 0.5)', lineWidth: 2
      });
      window.drawLandmarks(ctx, lm, {
        color: 'rgba(196, 255, 54, 0.9)', lineWidth: 1, radius: 3
      });
    }
    ctx.restore();
  }

  function update() {
    if (manualOverride) { requestAnimationFrame(update); return; }

    const hs_ref = latestHands && latestHands.multiHandLandmarks ? latestHands.multiHandLandmarks.length : 0;
    const mouth_ref = mouthOpenRatio(latestFace ? latestFace.multiFaceLandmarks : null);
    const g = classify();
    const now = performance.now();
    var hs = [], mouth = mouth_ref;
    if (latestHands && latestHands.multiHandLandmarks) {
      for (const lm of latestHands.multiHandLandmarks) {
        hs.push({ f: fingers(lm), c: handCenter(lm) });
      }
    }

    if (g !== pendingGesture) {
      pendingGesture = g;
      pendingStart = now;
    }

    if (g === pendingGesture && now - pendingStart > HOLD_MS) {
      showMeme(g);
    }

    const debugParts = [];
    if (hs.length) {
      debugParts.push('hands: ' + hs.length);
      const f0 = hs[0].f;
      const fd = (f0.thumb?'T':'_') + (f0.index?'I':'_') + (f0.middle?'M':'_') + (f0.ring?'R':'_') + (f0.pinky?'P':'_');
      debugParts.push('[' + fd + ']');
    }
    if (mouth > 0.05) debugParts.push('mouth: ' + mouth.toFixed(2));
    debugParts.push('→ ' + g);
    $debug.textContent = debugParts.join(' | ');

    drawHands();
    requestAnimationFrame(update);
  }

  function setProgress(pct, msg) {
    $prog.style.width = pct + '%';
    $status.textContent = msg;
  }

  try {
    setProgress(10, 'loading hand tracking...');

    const hands = new window.Hands({
      locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5,
    });
    hands.onResults(r => { latestHands = r; });

    setProgress(30, 'loading face mesh...');

    const faceMesh = new window.FaceMesh({
      locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/' + f
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });
    faceMesh.onResults(r => { latestFace = r; });

    setProgress(50, 'starting camera...');

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    $video.srcObject = stream;
    await $video.play();

    setProgress(70, 'initializing models...');

    await hands.send({ image: $video });
    await faceMesh.send({ image: $video });

    setProgress(90, 'almost ready...');

    const camera = new window.Camera($video, {
      onFrame: async () => {
        await hands.send({ image: $video });
        if (frameCount % FACE_EVERY === 0) {
          await faceMesh.send({ image: $video });
        }
        frameCount++;
      },
      width: 640,
      height: 480,
    });
    await camera.start();

    setProgress(100, 'ready!');

    setTimeout(() => {
      $loading.classList.add('hidden');
      $app.style.display = 'flex';
      showMeme('idle');
      requestAnimationFrame(update);
    }, 300);

  } catch (err) {
    console.error('Init error:', err);
    if (err.name === 'NotAllowedError' || err.name === 'NotFoundError') {
      $errMsg.textContent = 'Camera access was denied or no camera found. Please allow camera access and reload the page.';
    } else {
      $errMsg.textContent = 'Failed to initialize: ' + err.message + '. Try reloading the page.';
    }
    $loading.classList.add('hidden');
    $error.style.display = 'flex';
  }

})();
</script>
